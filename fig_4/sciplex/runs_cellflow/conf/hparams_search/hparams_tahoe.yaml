condition_embedding_dim: 256
time_encoder_dims: [2048, 1024, 256]
time_encoder_dropout: 0.0
time_max_period: 0
hidden_dims: [2048, 2048, 2048]
hidden_dropout: 0.0
decoder_dims: [2048, 2048, 2048]
decoder_dropout: 0.0
pooling: "mean"
layers_before_pool: 
  cytokines:
    layer_type: mlp
    dims: [1024, 1024]
    dropout_rate: 0.5
  donor:
    layer_type: mlp
    dims: [256, 256]
    dropout_rate: 0.0
layers_after_pool:
  layer_type: mlp
  dims: [1024, 1024]
  dropout_rate: 0.0
cond_output_dropout: 0.5
time_freqs: 1024
flow_noise: 0.1
learning_rate: 0.00005
multi_steps: 50
epsilon: 1.0
tau_a: 1.0
tau_b: 1.0
flow_type: "constant_noise"
linear_projection_before_concatenation: False
layer_norm_before_concatenation: False
conditioning: "film"
regularization: 0.1
ema: 0.01
